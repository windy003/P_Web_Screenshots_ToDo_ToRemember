<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>{{ key }} - {{ filename }}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}?v={{ asset_version }}">
</head>
<body class="viewer-body">
  <div class="viewer-full" id="viewer-full">
    <img id="viewer-img" src="{{ url_for('media', key=key, filename=filename) }}" alt="{{ filename }}">

    <div class="overlay-controls hidden" id="overlay-controls">
      <div class="floating-panel" id="floating-panel">
        <div class="panel-grip"><span></span><span></span><span></span></div>

        <div class="panel-info">
          <button id="filename-btn" class="ov-btn icon info" type="button" aria-label="查看文件名">i</button>
          <span class="ov-index">{{ index + 1 }} / {{ total }}</span>
        </div>

        <div class="panel-filename hidden" id="panel-filename">{{ filename }}</div>

        <div class="panel-nav">
          {% if prev_index is not none %}
            <a id="prev-link" class="ov-btn icon" href="{{ url_for('view_image', key=key, index=prev_index) }}" aria-label="上一张">&larr;</a>
          {% else %}
            <span class="ov-btn icon disabled" aria-label="上一张">&larr;</span>
          {% endif %}

          {% if next_index is not none %}
            <a id="next-link" class="ov-btn icon" href="{{ url_for('view_image', key=key, index=next_index) }}" aria-label="下一张">&rarr;</a>
          {% else %}
            <span class="ov-btn icon disabled" aria-label="下一张">&rarr;</span>
          {% endif %}
        </div>

        <div class="panel-actions">
          <div class="panel-actions-row">
            {% if show_postpone %}
            <button id="postpone-btn" class="ov-btn round postpone" type="button">3天后</button>
            {% endif %}
            <button id="undo-btn" class="ov-btn round undo" type="button" disabled>撤销</button>
          </div>
          <div class="panel-actions-row">
            <button id="delete-btn" class="ov-btn round delete" type="button">删除</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    var overlay = document.getElementById("overlay-controls");
    var img = document.getElementById("viewer-img");
    var panel = document.getElementById("floating-panel");

    var filenameBtn = document.getElementById("filename-btn");
    var panelFilename = document.getElementById("panel-filename");
    if (filenameBtn && panelFilename) {
      filenameBtn.addEventListener("click", function () {
        panelFilename.classList.toggle("hidden");
      });
    }

    // 禁掉长按图片/面板弹出的系统"保存图片"菜单,避免和拖动手势冲突。
    document.addEventListener("contextmenu", function (e) {
      e.preventDefault();
    });

    function goToPrev() {
      var el = document.getElementById("prev-link");
      if (el) window.location.href = el.href;
    }

    function goToNext() {
      var el = document.getElementById("next-link");
      if (el) window.location.href = el.href;
    }

    document.addEventListener("keydown", function (e) {
      if (e.key === "ArrowLeft") {
        goToPrev();
      } else if (e.key === "ArrowRight") {
        goToNext();
      } else if (e.key === " " || e.key === "Escape") {
        overlay.classList.toggle("hidden");
      }
    });

    // ---- 左右滑动切图:在悬浮面板之外的区域(照片本身)滑动,
    // 横向位移够大且明显大于纵向位移时才当作切图手势,避免和点按图片
    // 唤出面板、拖动面板本身互相打架。 ----
    var viewerFull = document.getElementById("viewer-full");
    var SWIPE_THRESHOLD = 50;
    var swipeStart = null;

    // 双指放大之后(页面通过 visualViewport 报告缩放比例),单指拖动是在平移
    // 放大后的画面,不能再当成"滑动切图"来处理,否则想挪动画面就会跳到别的图。
    function isPageZoomed() {
      return !!(window.visualViewport && window.visualViewport.scale > 1.01);
    }

    // ---- 双击放大/缩小:双击图片的某个位置就把那里放大,再双击一次还原。
    // 用 CSS transform 缩放图片本身,不改页面布局,也不会影响悬浮面板的定位。
    // 放大后单指拖动改为平移画面(见下面的 touchmove),不再触发左右滑动切图。 ----
    var ZOOM_SCALE = 2.5;
    var PAN_THRESHOLD = 6;
    var zoomScale = 1;
    var zoomX = 0;
    var zoomY = 0;

    function isImageZoomed() {
      return zoomScale > 1.01;
    }

    function applyImageZoom() {
      img.style.transform =
        "translate(" + zoomX + "px, " + zoomY + "px) scale(" + zoomScale + ")";
    }

    // 平移范围限制在图片边界内,避免把画面拖丢,只剩下黑屏。
    function clampImagePan() {
      var maxX = Math.max(0, (img.offsetWidth * zoomScale - viewerFull.clientWidth) / 2);
      var maxY = Math.max(0, (img.offsetHeight * zoomScale - viewerFull.clientHeight) / 2);
      zoomX = clamp(zoomX, -maxX, maxX);
      zoomY = clamp(zoomY, -maxY, maxY);
    }

    // 图片在 .viewer-full 里居中对齐,元素中心和容器中心重合。transform 以
    // 元素中心为原点,要让双击点(clientX/clientY)在缩放前后停在原地,
    // 需要平移 (1 - scale) * (双击点 - 容器中心)。
    function zoomInAt(clientX, clientY) {
      var rect = viewerFull.getBoundingClientRect();
      var cx = rect.left + rect.width / 2;
      var cy = rect.top + rect.height / 2;
      zoomScale = ZOOM_SCALE;
      zoomX = (1 - zoomScale) * (clientX - cx);
      zoomY = (1 - zoomScale) * (clientY - cy);
      clampImagePan();
      applyImageZoom();
    }

    function zoomOut() {
      zoomScale = 1;
      zoomX = 0;
      zoomY = 0;
      applyImageZoom();
    }

    function toggleImageZoom(clientX, clientY) {
      if (isImageZoomed()) {
        zoomOut();
      } else {
        zoomInAt(clientX, clientY);
      }
    }

    // ---- 单指/双击识别:单击开关悬浮面板,双击缩放。单击要等一小会儿,
    // 确认不是双击的第一下之后再执行,否则双击时会顺带把面板开关一次。 ----
    var DOUBLE_TAP_MS = 280;
    var DOUBLE_TAP_DIST = 40;
    var TAP_TOGGLE_DELAY = 250;
    var lastTapTime = 0;
    var lastTapX = 0;
    var lastTapY = 0;
    var tapToggleTimer = null;
    var suppressTapUntil = 0;

    img.addEventListener("click", function (e) {
      // 刚拖动平移过画面,浏览器可能补发一个 click,不要当成点按。
      if (Date.now() < suppressTapUntil) return;
      // 已经双指放大了网页本身时,双击交给系统处理,避免两套缩放互相打架。
      if (isPageZoomed()) return;
      var now = Date.now();
      if (now - lastTapTime < DOUBLE_TAP_MS &&
          Math.hypot(e.clientX - lastTapX, e.clientY - lastTapY) < DOUBLE_TAP_DIST) {
        clearTimeout(tapToggleTimer);
        tapToggleTimer = null;
        lastTapTime = 0;
        toggleImageZoom(e.clientX, e.clientY);
        return;
      }
      lastTapTime = now;
      lastTapX = e.clientX;
      lastTapY = e.clientY;
      clearTimeout(tapToggleTimer);
      tapToggleTimer = setTimeout(function () {
        overlay.classList.toggle("hidden");
      }, TAP_TOGGLE_DELAY);
    });

    var panStart = null;

    viewerFull.addEventListener("touchstart", function (e) {
      if (panel.contains(e.target) || isPageZoomed()) {
        swipeStart = null;
        panStart = null;
        return;
      }
      if (isImageZoomed()) {
        // 图片已被双击放大:单指拖动平移画面。
        if (e.touches.length !== 1) {
          panStart = null;
          img.classList.remove("panning");
          return;
        }
        var p = e.touches[0];
        panStart = { x: p.clientX, y: p.clientY, startX: zoomX, startY: zoomY, moved: false };
        swipeStart = null;
        return;
      }
      panStart = null;
      if (e.touches.length !== 1) {
        swipeStart = null;
        return;
      }
      var t = e.touches[0];
      swipeStart = { x: t.clientX, y: t.clientY };
    }, { passive: true });

    viewerFull.addEventListener("touchmove", function (e) {
      if (!panStart || e.touches.length !== 1) return;
      var t = e.touches[0];
      var dx = t.clientX - panStart.x;
      var dy = t.clientY - panStart.y;
      if (!panStart.moved && Math.hypot(dx, dy) > PAN_THRESHOLD) {
        panStart.moved = true;
        img.classList.add("panning");
      }
      if (!panStart.moved) return;
      zoomX = panStart.startX + dx;
      zoomY = panStart.startY + dy;
      clampImagePan();
      applyImageZoom();
      if (e.cancelable) e.preventDefault();
    }, { passive: false });

    viewerFull.addEventListener("touchend", function (e) {
      if (panStart) {
        var panned = panStart.moved;
        panStart = null;
        img.classList.remove("panning");
        if (panned) suppressTapUntil = Date.now() + 400;
        swipeStart = null;
        return;
      }
      if (!swipeStart || isPageZoomed()) {
        swipeStart = null;
        return;
      }
      var t = e.changedTouches[0];
      var dx = t.clientX - swipeStart.x;
      var dy = t.clientY - swipeStart.y;
      swipeStart = null;
      if (Math.abs(dx) < SWIPE_THRESHOLD || Math.abs(dx) < Math.abs(dy) * 1.5) return;
      if (dx < 0) {
        goToNext();
      } else {
        goToPrev();
      }
    });

    viewerFull.addEventListener("touchcancel", function () {
      panStart = null;
      swipeStart = null;
      img.classList.remove("panning");
    });

    var postponeBtn = document.getElementById("postpone-btn");
    if (postponeBtn) {
      postponeBtn.addEventListener("click", function () {
        postponeBtn.disabled = true;
        postponeBtn.textContent = "…";
        fetch("{{ url_for('postpone', key=key, filename=filename) }}", { method: "POST" })
          .then(function (resp) {
            if (!resp.ok) throw new Error("postpone failed");
            return resp.json();
          })
          .then(function () {
            {% if next_index is not none %}
              // 当前这张移走后,后面的图片都会往前挪一位,原来的位置现在就是下一张
              window.location.href = "{{ url_for('view_image', key=key, index=index) }}";
            {% else %}
              window.location.href = "{{ url_for('browse', key=key) }}";
            {% endif %}
          })
          .catch(function () {
            postponeBtn.disabled = false;
            postponeBtn.textContent = "3天后";
            alert("操作失败,请重试");
          });
      });
    }

    var deleteBtn = document.getElementById("delete-btn");
    if (deleteBtn) {
      deleteBtn.addEventListener("click", function () {
        deleteBtn.disabled = true;
        deleteBtn.textContent = "…";
        fetch("{{ url_for('delete_image', key=key, filename=filename) }}", { method: "POST" })
          .then(function (resp) {
            if (!resp.ok) throw new Error("delete failed");
            return resp.json();
          })
          .then(function () {
            {% if next_index is not none %}
              // 当前这张删掉后,后面的图片都会往前挪一位,原来的位置现在就是下一张
              window.location.href = "{{ url_for('view_image', key=key, index=index) }}";
            {% else %}
              window.location.href = "{{ url_for('browse', key=key) }}";
            {% endif %}
          })
          .catch(function () {
            deleteBtn.disabled = false;
            deleteBtn.textContent = "删除";
            alert("操作失败,请重试");
          });
      });
    }

    // ---- 撤销:删除/3天后最多能记住最近 5 步,点一下挪回上一步操作前的状态。
    // 撤销的图片可能属于任何一个文件夹(不一定是当前正在看的这个),所以
    // 撤销成功后直接跳到那张图恢复后所在文件夹的全屏查看页,而不是退回网格页。 ----
    var undoBtn = document.getElementById("undo-btn");
    if (undoBtn) {
      function refreshUndoButton() {
        fetch("/api/undo/status")
          .then(function (resp) { return resp.json(); })
          .then(function (data) {
            undoBtn.disabled = !data.count;
          })
          .catch(function () { /* 查询失败就保持当前禁用状态,不影响其它操作 */ });
      }

      undoBtn.addEventListener("click", function () {
        undoBtn.disabled = true;
        undoBtn.textContent = "…";
        fetch("/api/undo", { method: "POST" })
          .then(function (resp) {
            if (!resp.ok) throw new Error("undo failed");
            return resp.json();
          })
          .then(function (data) {
            window.location.href = "/view/" + encodeURIComponent(data.key) + "/" + data.index;
          })
          .catch(function () {
            undoBtn.textContent = "撤销";
            refreshUndoButton();
            alert("没有可撤销的操作,或操作失败");
          });
      });

      refreshUndoButton();
    }

    // ---- 悬浮控制面板:整个方形面板都能拖动,位置记忆(按面板中心点相对
    // 屏幕宽高的比例存储,这样旋转屏幕/换设备后依然落在合理的位置)。
    // 同时支持触摸(手机上实际用的)和鼠标(方便在电脑上调试)两套事件,
    // 不依赖 Pointer Events / setPointerCapture,避免个别 WebView 版本上
    // 悬浮层拖不动的问题。 ----
    var POSITION_KEY = "viewerPanelPos";

    function clamp(value, min, max) {
      return Math.max(min, Math.min(max, value));
    }

    function setPanelPosition(left, top) {
      var rect = panel.getBoundingClientRect();
      var maxLeft = Math.max(8, window.innerWidth - rect.width - 8);
      var maxTop = Math.max(8, window.innerHeight - rect.height - 8);
      panel.style.left = clamp(left, 8, maxLeft) + "px";
      panel.style.top = clamp(top, 8, maxTop) + "px";
      panel.style.bottom = "auto";
      panel.style.transform = "none";
    }

    function savePanelPosition() {
      var rect = panel.getBoundingClientRect();
      var cx = (rect.left + rect.width / 2) / window.innerWidth;
      var cy = (rect.top + rect.height / 2) / window.innerHeight;
      try {
        localStorage.setItem(POSITION_KEY, JSON.stringify({ xf: cx, yf: cy }));
      } catch (e) { /* localStorage 不可用时忽略,不影响拖动本身 */ }
    }

    function restorePanelPosition() {
      var raw;
      try {
        raw = localStorage.getItem(POSITION_KEY);
      } catch (e) {
        return;
      }
      if (!raw) return;
      var pos;
      try {
        pos = JSON.parse(raw);
      } catch (e) {
        return;
      }
      if (typeof pos.xf !== "number" || typeof pos.yf !== "number") return;
      var rect = panel.getBoundingClientRect();
      setPanelPosition(pos.xf * window.innerWidth - rect.width / 2, pos.yf * window.innerHeight - rect.height / 2);
    }

    var DRAG_THRESHOLD = 6;
    var dragState = null;
    var suppressClick = false;

    function pointFromEvent(e) {
      if (e.touches && e.touches.length) return { x: e.touches[0].clientX, y: e.touches[0].clientY };
      if (e.changedTouches && e.changedTouches.length) return { x: e.changedTouches[0].clientX, y: e.changedTouches[0].clientY };
      return { x: e.clientX, y: e.clientY };
    }

    function dragStart(e) {
      if (dragState) return;
      var p = pointFromEvent(e);
      var rect = panel.getBoundingClientRect();
      dragState = { startX: p.x, startY: p.y, startLeft: rect.left, startTop: rect.top, moved: false };
    }

    function dragMove(e) {
      if (!dragState) return;
      var p = pointFromEvent(e);
      var dx = p.x - dragState.startX;
      var dy = p.y - dragState.startY;
      if (!dragState.moved && Math.hypot(dx, dy) > DRAG_THRESHOLD) {
        dragState.moved = true;
        panel.classList.add("dragging");
      }
      if (dragState.moved) {
        setPanelPosition(dragState.startLeft + dx, dragState.startTop + dy);
        if (e.cancelable) e.preventDefault();
      }
    }

    function dragEnd() {
      if (!dragState) return;
      var moved = dragState.moved;
      panel.classList.remove("dragging");
      dragState = null;
      if (moved) {
        savePanelPosition();
        suppressClick = true;
        setTimeout(function () { suppressClick = false; }, 0);
      }
    }

    panel.addEventListener("touchstart", dragStart, { passive: true });
    panel.addEventListener("touchmove", dragMove, { passive: false });
    panel.addEventListener("touchend", dragEnd);
    panel.addEventListener("touchcancel", dragEnd);

    panel.addEventListener("mousedown", dragStart);
    document.addEventListener("mousemove", dragMove);
    document.addEventListener("mouseup", dragEnd);

    panel.addEventListener("click", function (e) {
      if (suppressClick) {
        e.preventDefault();
        e.stopPropagation();
      }
    }, true);

    window.addEventListener("resize", function () {
      if (panel.style.left) {
        var rect = panel.getBoundingClientRect();
        setPanelPosition(rect.left, rect.top);
      }
    });

    restorePanelPosition();
  </script>
</body>
</html>
