<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ key }} - 图片浏览</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}?v={{ asset_version }}">
</head>
<body>
  <header class="top">
    <h1>{{ key }}({{ count }} 张,按从旧到新排序)</h1>
    <a class="back" href="{{ url_for('index') }}">&larr; 返回</a>
  </header>
  {% if images %}
  <div class="gallery">
    {% for name in images %}
      <a class="thumb" href="{{ url_for('view_image', key=key, index=loop.index0) }}">
        <img src="{{ url_for('media', key=key, filename=name) }}" loading="lazy" alt="{{ name }}">
      </a>
    {% endfor %}
  </div>
  {% else %}
  <div class="empty-hint">这个文件夹里还没有图片。</div>
  {% endif %}

  <div class="floating-undo">
    <button id="undo-btn" class="ov-btn undo" type="button" disabled>撤销</button>
  </div>

  <script>
    var undoBtn = document.getElementById("undo-btn");

    function refreshUndoButton() {
      fetch("/api/undo/status")
        .then(function (resp) { return resp.json(); })
        .then(function (data) {
          undoBtn.disabled = !data.count;
        })
        .catch(function () { /* 查询失败就保持当前禁用状态 */ });
    }

    undoBtn.addEventListener("click", function () {
      undoBtn.disabled = true;
      undoBtn.textContent = "撤销中…";
      fetch("/api/undo", { method: "POST" })
        .then(function (resp) {
          if (!resp.ok) throw new Error("undo failed");
          return resp.json();
        })
        .then(function (data) {
          window.location.href = "/view/" + encodeURIComponent(data.key) + "/" + data.index;
        })
        .catch(function () {
          undoBtn.textContent = "撤销";
          refreshUndoButton();
          alert("没有可撤销的操作,或操作失败");
        });
    });

    refreshUndoButton();
  </script>
</body>
</html>
